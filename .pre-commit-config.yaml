# Pre-commit: ruff lint+format, and a fast pytest gate (integration tests are
# marked and skipped here so commits stay <30s). Full suite runs in CI.
# Install once:  pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # MUST match the ruff the dev venv and CI install (see constraints.txt and
    # .github/workflows/ci.yml). A mismatch is not cosmetic: ruff changed its
    # assert-message formatting between releases, so a hook on an older rev
    # rewrites files that the local ruff just formatted the other way. The
    # symptom is a commit that fails with "files were modified by this hook"
    # on a tree that was already clean, and the diff churn that comes with it.
    rev: v0.16.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest-quick
        name: pytest (unit + property, no integration)
        # Use the project venv's python, not the system interpreter on PATH —
        # the test suite imports tensorflow/sklearn/qiskit that the bare system
        # Python (e.g. C:\Python314) does not have installed.
        entry: ./.venv/Scripts/python.exe -m pytest -m "not integration" -q --no-header -p no:cacheprovider
        language: system
        pass_filenames: false
        types: [python]
