[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quobo"
version = "1.0.0"
description = "QUBO-based quantum feature selection + QSVM for waste-image classification (IDP3)"
requires-python = ">=3.10"
dependencies = [
  "qiskit~=2.1",
  "qiskit-machine-learning~=0.9.0",
  "dimod>=0.12.22",
  "dwave-samplers>=1.8.0",
  "scikit-learn>=1.5,<2",
  "numpy>=2.3,<2.6",
  "pandas",
  "scipy",
  "opencv-python",
  "pillow",
  "matplotlib",
  "tqdm",
  "pyyaml",
  "requests",
]

[project.optional-dependencies]
full = ["tensorflow~=2.19", "qiskit-aer~=0.17"]   # heavy: backbone embeddings, optional on CI
edge = ["onnxruntime", "skl2onnx", "tf2onnx"]    # ONNX export for edge inference (Enhancement 8)
dev = ["pytest>=8", "ruff", "hypothesis>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
