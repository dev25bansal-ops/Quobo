[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quobo"
version = "1.0.0"
description = "QUBO-based quantum feature selection + QSVM for waste-image classification (IDP3)"
requires-python = ">=3.10"
dependencies = [
  "qiskit~=2.1",
  "qiskit-machine-learning~=0.9.0",
  "dimod>=0.12.22",
  "dwave-samplers>=1.8.0",
  "scikit-learn>=1.5,<1.11",
  "numpy>=2.3,<2.6",
  "pandas",
  "scipy",
  "opencv-python",
  "pillow",
  "matplotlib",
  "tqdm",
  "pyyaml",
  "requests",
  "pydantic>=2,<3",
]

[project.optional-dependencies]
full = ["tensorflow~=2.21", "qiskit-aer~=0.17"]   # heavy: backbone embeddings, optional on CI
edge = ["onnxruntime", "skl2onnx>=1.20", "tf2onnx"]    # ONNX export for edge inference (Enhancement 8)
dashboard = ["plotly>=5"]                        # interactive charts (Enhancement 5)
track = ["mlflow>=3"]                            # experiment tracking (Enhancement 10)
dev = ["pytest>=8", "pytest-cov", "ruff", "hypothesis>=6", "sphinx>=7", "myst-parser", "jupyterlab>=4"]   # tests, lint, docs, notebooks

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Prepend the repo root to sys.path for every test session. Without this, a
# module that imports `scripts.*` (e.g. tests/test_confusion_analysis.py,
# which has no sys.path bootstrap of its own) only works when another test
# module happened to mutate sys.path first — so `pytest tests/test_X.py`
# failed at collection while `python -m pytest` passed.
pythonpath = ["."]
markers = [
    "integration: end-to-end pipeline test (real TF model, no weight download); skipped by pre-commit, run in CI",
    "golden: statistical regression harness — compares a completed run's headline numbers to the frozen baseline; opt-in (QUOBO_GOLDEN=1), run in the 'golden' build profile",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Match the pre-commit hook's default rule selection (E4, E7, E9, F) so that
# `ruff check` and `pre-commit run ruff` agree on which noqa comments are
# legitimate. E402 (import-after-sys.path in scripts) and E741 (single-letter
# math notation I/O in the QUBO formulation) are deliberately suppressed.
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["src.quobo"]
branch = true

[tool.coverage.report]
# H-03: coverage gate (line + branch).
#
# CALIBRATED 2026-10-19. The previous target was the installed `quobo` package
# identity, but the suite imports `src.quobo.*` — coverage warned
# "Module quobo was previously imported, but not measured" and reported 0-19%
# for every module, which would have failed this gate spuriously. Measuring
# `src.quobo` gives the honest number: 65% (line+branch), 171 tests green.
#
# The gate is set to 60 to leave headroom below the measured 65%: it is a
# regression tripwire (a large drop means something stopped being exercised),
# not a quality target. Raise it as real coverage improves — the largest
# remaining gaps are data_prep.py (46%) and selection.py (68%).
fail_under = 60
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
