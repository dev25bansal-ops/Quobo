name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (core deps + TF for the integration test)
        # -e ".[dev]" --no-deps skips the extra's deps, so the lint tool is
        # pinned explicitly (keep in sync with ruff-pre-commit rev below).
        run: |
          pip install -e ".[dev]" --no-deps
          pip install "qiskit~=2.1" "qiskit-machine-learning~=0.9.0" \
                      "dimod>=0.12.22" "dwave-samplers>=1.8.0" \
                      "scikit-learn>=1.5,<1.11" "numpy>=2.3,<2.6" pandas scipy \
                      opencv-python-headless pillow matplotlib pyyaml requests tqdm \
                      "pydantic>=2,<3" "ruff==0.16.5" "pytest>=8" "hypothesis>=6" \
                      "onnxruntime" "skl2onnx>=1.20" \
                      "tensorflow-cpu~=2.21"

      - name: Ruff (lint)
        run: ruff check src/ scripts/ tests/

      - name: pip-audit (dependency security)
        # advisory for now: report findings but don't fail the build, so a new
        # CVE in a transitive dep doesn't block unrelated PRs. Promote to
        # --strict once the report is clean (local run 2026-09-16: clean).
        run: |
          pip install pip-audit
          pip-audit --progress-spinner off || echo "::warning::pip-audit found advisories (non-blocking)"

      - name: Pytest (unit + integration)
        run: pytest tests/ -v --tb=short -q

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (docs deps)
        # The docs build imports the package for autodoc; docs/conf.py adds src/
        # to sys.path, so the editable install is not required for the import
        # itself — but installing it keeps the build faithful to a user's setup.
        run: |
          pip install -e ".[dev]" --no-deps
          pip install "sphinx>=7" "myst-parser>=4" "pydantic>=2,<3" \
                      "scikit-learn>=1.5,<1.11" "numpy>=2.3,<2.6" pandas scipy \
                      pyyaml

      - name: Build the API reference
        # -W turns warnings into errors: an autodoc import failure would
        # otherwise only warn, and the build would pass with an empty API
        # reference page.
        run: sphinx -W -b html docs docs/_build/html

      - name: Upload the built docs
        uses: actions/upload-artifact@v4
        with:
          name: quobo-docs
          path: docs/_build/html
