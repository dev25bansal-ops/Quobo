name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (core deps + TF for the integration test)
        run: |
          pip install -e ".[dev]" --no-deps
          pip install "qiskit~=2.1" "qiskit-machine-learning~=0.9.0" \
                      "dimod>=0.12.22" "dwave-samplers>=1.8.0" \
                      "scikit-learn>=1.5,<2" "numpy<2.3" pandas scipy \
                      opencv-python-headless pillow matplotlib pyyaml requests tqdm \
                      "tensorflow-cpu~=2.19"

      - name: Ruff (lint)
        run: ruff check src/ scripts/ tests/

      - name: Pytest (unit + integration)
        run: pytest tests/ -v --tb=short -q
