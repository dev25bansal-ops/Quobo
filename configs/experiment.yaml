# Quobo experiment configuration

seed: 42

data:
  # TACO supercategories collapsed to a tractable set (research: 28-way exceeds
  # an 8-feature budget; TACO-10-style coarse classes are the precedented middle)
  classes:
    - bottle
    - can
    - cigarette
    - carton
    - cup
    - lid
    - other
  min_images_per_class: 40
  img_size: 224

features:
  backbone: MobileNetV2        # 1280-d embeddings
  pca_components: 50           # candidate pool for selection
  standardize: true

selection:
  k: 8                         # feature budget for ALL arms (comparability)

qubo:
  # Muecke QFS formulation: Q(x,a) = -a*sum(I_i x_i) + (1-a)*sum(R_ij x_i x_j)
  # alpha binary-searched until exactly k features selected
  mi_bins: 16                  # quantile bins for MI estimation
  sa_sweeps: 20000             # simulated annealing sweeps per alpha trial
  sa_repeats: 10

qsvm:
  feature_map: ZZFeatureMap
  reps: 1
  entanglement: linear         # 7 ZZ pairs vs full's 28 — lower concentration risk
  max_train_samples: 400       # kernel matrix is O(n^2); subsample beyond this
  test_fraction: 0.25

experiment:
  n_repeats: 5                 # repeated splits, identical budget across arms A-D
  arms: [A_random, B_pca, C_mi, D_qubo]
  baselines: [rbf_svm]         # mandatory per Huang 2021 caveat
