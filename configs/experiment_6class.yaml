# Headline config: 6 concrete classes, 'other' grab-bag excluded.
# Rationale: 'other' is 52% of crops and mixes 50 unrelated categories, so it
# drowns both the metrics and the MI/QUBO objectives. The 6 kept classes are
# coherent object types with balanced-enough counts (123-340 crops).
seed: 42

data:
  classes:
    - bottle
    - can
    - cigarette
    - carton
    - cup
    - lid
  min_images_per_class: 40

features:
  backbone: MobileNetV2
  pca_components: 50

selection:
  k: 8

qubo:
  mi_bins: 16
  sa_sweeps: 20000
  sa_repeats: 10
  parallel: true              # L-04: threaded coarse alpha scan (~3x; result-identical)

qsvm:
  reps: 1
  entanglement: linear
  max_train_samples: 400
  test_fraction: 0.25
  tune_rbf: true

experiment:
  n_repeats: 25
  arms: [A_random, B_pca, C_mi, D_qubo, E_lasso, F_mrmr, Z_full]
